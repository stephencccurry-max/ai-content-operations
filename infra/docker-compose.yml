services:
  db:
    image: postgres:16
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ai_content_ops}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-ai_content_ops}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ../apps/api
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      EXPORT_DIR: /data/exports
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-mock}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      ZHIPU_BASE_URL: ${ZHIPU_BASE_URL:-https://open.bigmodel.cn/api/coding/paas/v4}
      ZHIPU_MODEL: ${ZHIPU_MODEL:-glm-5.3}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-}
    volumes:
      - ../data:/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  n8n:
    image: n8nio/n8n
    environment:
      N8N_SECURE_COOKIE: "false"
      # WF-01 HTTP nodes use $env.INTERNAL_API_*; n8n 2.x blocks this by default.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8ndata:/home/node/.n8n
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  n8ndata:
